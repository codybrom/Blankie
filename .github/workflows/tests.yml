name: "Tests"
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    # App build surface only (skips docs, notes, apple_docs, scripts and top-level markdown).
    paths:
      - "Blankie/**"
      - "BlankieTests/**"
      - "BlankieWidget/**"
      - "BlankiePresetPreview/**"
      - "BlankieAssets/**"
      - "Assets.xcassets/**"
      - "BrandAssets.xcassets/**"
      - "Blankie.xcodeproj/**"
      - "Blankie.xctestplan"
      - "Blankie*.plist"
      - "**/*.entitlements"
      - "**/*.xcconfig"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Blankie/**"
      - "BlankieTests/**"
      - "BlankieWidget/**"
      - "BlankiePresetPreview/**"
      - "BlankieAssets/**"
      - "Assets.xcassets/**"
      - "BrandAssets.xcassets/**"
      - "Blankie.xcodeproj/**"
      - "Blankie.xctestplan"
      - "Blankie*.plist"
      - "**/*.entitlements"
      - "**/*.xcconfig"
      - ".github/workflows/tests.yml"

# The job only checks out and runs xcodebuild; nothing writes back.
permissions:
  contents: read

# One run per ref; a newer push cancels the older run on the shared runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    # The Xcode 27 image (macOS 27), so the OS 27 code behind
    # `canImport(NowPlaying)` compiles and its tests run.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # The image's default Xcode.app is the release build. The newest
          # installed one is a beta, so don't pick by version.
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: Run unit tests
        run: |
          if [ ! -f "Configuration.xcconfig" ]; then
            echo "Creating Configuration.xcconfig from example..."
            cp Configuration.example.xcconfig Configuration.xcconfig
            sed -i '' 's/YOUR_TEAM_ID_HERE/DUMMY_TEAM/' Configuration.xcconfig
            sed -i '' 's/com.yournamehere.blankie/com.example.blankie/' Configuration.xcconfig
          fi
          # Unsigned builds carry no entitlements, and on iOS 27 AssetPackManager stops
          # the app without its app group. Link the group in as an __entitlements section
          # (debug dylib off so it lands in the main executable, where the simulator reads it).
          APP_GROUP=$(sed -n 's/^APP_GROUP_IDENTIFIER *= *//p' Configuration.xcconfig)
          ENTITLEMENTS="$RUNNER_TEMP/simulator.entitlements"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<plist version="1.0"><dict>' \
            '<key>com.apple.security.application-groups</key>' \
            "<array><string>$APP_GROUP</string></array>" \
            '</dict></plist>' > "$ENTITLEMENTS"
          plutil -lint "$ENTITLEMENTS"
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project Blankie.xcodeproj \
            -scheme "Blankie (Universal)" \
            -testPlan Blankie \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_DEBUG_DYLIB=NO \
            "OTHER_LDFLAGS=\$(inherited) -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __entitlements -Xlinker $ENTITLEMENTS"
