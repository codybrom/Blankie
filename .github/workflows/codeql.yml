name: "CodeQL"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "15 14 * * 1"
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-26') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Select latest Xcode
        if: matrix.language == 'swift'
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST=/Applications/Xcode.app; fi
          # macos-26's default Xcode is 26.4.1, which can't open the project's
          # objectVersion=100. Selecting the newest installed Xcode (26.5, the
          # same build as local) is required so xcodebuild can read it.
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
      - name: Build Swift project
        if: matrix.language == 'swift'
        run: |
          if [ ! -f "Configuration.xcconfig" ]; then
            echo "Creating Configuration.xcconfig from example..."
            cp Configuration.example.xcconfig Configuration.xcconfig
            sed -i '' 's/YOUR_TEAM_ID_HERE/DUMMY_TEAM/' Configuration.xcconfig
            sed -i '' 's/com.yournamehere.blankie/com.example.blankie/' Configuration.xcconfig
          fi
          # macOS build is currently broken (tracked separately); CodeQL only
          # needs the Swift source compiled, so build the iOS Simulator variant
          # of the same sources — no signing required.
          xcodebuild clean build \
            -project Blankie.xcodeproj \
            -scheme "Blankie (Universal)" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
