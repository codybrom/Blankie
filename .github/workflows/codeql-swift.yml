name: "CodeQL (Swift)"
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    # Only the Xcode/app build surface — not docs, notes, apple_docs, scripts
    # (incl. scripts/*.swift), or top-level markdown.
    paths:
      - "Blankie/**"
      - "BlankieTests/**"
      - "BlankieUITests/**"
      - "Blankie.xcodeproj/**"
      - "Blankie.xctestplan"
      - "Blankie*.plist"
      - "**/*.entitlements"
      - "**/*.xcconfig"
      - ".github/workflows/codeql-swift.yml"
  pull_request:
    branches: ["main"]
    # ready_for_review so flipping a draft to ready kicks off a scan.
    # No path filter here: the PR's "Code scanning results" check expects
    # every category main has, and a filtered-out run reads as
    # "configuration not found".
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "15 14 * * 1"

# One run per ref: a newer push cancels the superseded run instead of
# queueing behind it on the shared runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (swift)
    # Don't scan draft PRs (push/schedule are unaffected)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # The Xcode 27 image (macOS 27), so the OS 27 code behind
    # `canImport(NowPlaying)` is compiled and scanned.
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Select Xcode
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # The image's default Xcode.app is the release build. The newest
          # installed one is a beta, so don't pick by version.
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: Build Swift project
        run: |
          if [ ! -f "Configuration.xcconfig" ]; then
            echo "Creating Configuration.xcconfig from example..."
            cp Configuration.example.xcconfig Configuration.xcconfig
            sed -i '' 's/YOUR_TEAM_ID_HERE/DUMMY_TEAM/' Configuration.xcconfig
            sed -i '' 's/com.yournamehere.blankie/com.example.blankie/' Configuration.xcconfig
          fi
          # macOS build is currently broken (tracked separately); CodeQL only
          # needs the Swift source compiled, so build the iOS Simulator variant
          # of the same sources — no signing required.
          # The extractor traces every compiler invocation, and a generic
          # simulator destination compiles arm64 and x86_64. The shared runner
          # lost communication twice under that load, so build one
          # architecture with two concurrent jobs.
          xcodebuild clean build \
            -project Blankie.xcodeproj \
            -scheme "Blankie (Universal)" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -jobs 2 \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
