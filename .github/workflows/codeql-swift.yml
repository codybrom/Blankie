name: "CodeQL (Swift)"
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    # App build surface only (skips docs, notes, apple_docs, scripts and top-level markdown).
    paths:
      - "Blankie/**"
      - "BlankieTests/**"
      - "BlankieUITests/**"
      - "Blankie.xcodeproj/**"
      - "Blankie.xctestplan"
      - "Blankie*.plist"
      - "**/*.entitlements"
      - "**/*.xcconfig"
      - ".github/workflows/codeql-swift.yml"
  pull_request:
    branches: ["main"]
    # ready_for_review scans a draft once it's marked ready. No path filter: the PR's code
    # scanning check needs every category main has, or it reports "configuration not found".
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "15 14 * * 1"

# One run per ref; a newer push cancels the older run on the shared runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (swift)
    # Don't scan draft PRs (push/schedule are unaffected)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Select latest Xcode
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST=/Applications/Xcode.app; fi
          # The image's default Xcode (26.4.1) can't open objectVersion=100, so
          # select the newest installed Xcode.
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
      - name: Build Swift project
        run: |
          if [ ! -f "Configuration.xcconfig" ]; then
            echo "Creating Configuration.xcconfig from example..."
            cp Configuration.example.xcconfig Configuration.xcconfig
            sed -i '' 's/YOUR_TEAM_ID_HERE/DUMMY_TEAM/' Configuration.xcconfig
            sed -i '' 's/com.yournamehere.blankie/com.example.blankie/' Configuration.xcconfig
          fi
          # CodeQL only needs the Swift compiled, so build the simulator variant unsigned.
          # The runner drops its connection under the extractor's tracing load, so
          # build one arch, one job at a time, with no debug info or preview dylib.
          xcodebuild clean build \
            -project Blankie.xcodeproj \
            -scheme "Blankie (Universal)" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -jobs 1 \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            DEBUG_INFORMATION_FORMAT= \
            ENABLE_PREVIEWS=NO \
            ENABLE_DEBUG_DYLIB=NO
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
